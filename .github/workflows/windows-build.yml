name: Windows desktop preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Armuda World Directory Map/Armuda/**"
      - "assets/**"
      - "packaging/**"
      - "requirements-desktop.txt"

jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-desktop.txt pyinstaller==6.22.2
      - name: Unit tests
        shell: pwsh
        run: |
          $env:PYTHONUTF8='1'
          python -m unittest discover -s "Armuda World Directory Map/Armuda/tests" -p "test_*.py" -v
      - name: Build Windows package
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Armuda-Windows-x64
          path: |
            release/windows/*.zip
            release/windows/*.sha256
